<script>
  const carousels = {};

  function initCarousel(id) {
    const el = document.getElementById(id);
    const track = el.querySelector('.carousel-track');
    const slides = Array.from(track.querySelectorAll('.carousel-slide'));
    const total = slides.length;

    // 複製首尾，實現無縫輪播
    const firstClone = slides[0].cloneNode(true);
    const lastClone = slides[total - 1].cloneNode(true);
    track.appendChild(firstClone);
    track.insertBefore(lastClone, slides[0]);

    // 從 index 1 開始（跳過頭部複製張）
    let current = 1;
    track.style.transition = 'none';
    track.style.transform = `translateX(-${current * 100}%)`;

    carousels[id] = { current, total, locked: false };

    // 動畫結束後處理無縫跳轉
    track.addEventListener('transitionend', () => {
      const state = carousels[id];
      if (state.current === 0) {
        track.style.transition = 'none';
        state.current = state.total;
        track.style.transform = `translateX(-${state.current * 100}%)`;
      } else if (state.current === state.total + 1) {
        track.style.transition = 'none';
        state.current = 1;
        track.style.transform = `translateX(-${state.current * 100}%)`;
      }
      state.locked = false;
    });

    let startX = 0, isDragging = false;
    track.addEventListener('touchstart', e => { startX = e.touches[0].clientX; isDragging = true; }, { passive: true });
    track.addEventListener('touchend', e => {
      if (!isDragging) return;
      const diff = startX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 40) moveCarousel(id, diff > 0 ? 1 : -1);
      isDragging = false;
    });
    track.addEventListener('mousedown', e => { startX = e.clientX; isDragging = true; });
    track.addEventListener('mouseup', e => {
      if (!isDragging) return;
      const diff = startX - e.clientX;
      if (Math.abs(diff) > 40) moveCarousel(id, diff > 0 ? 1 : -1);
      isDragging = false;
    });
    track.addEventListener('mouseleave', () => { isDragging = false; });
  }

  function moveCarousel(id, dir) {
    const el = document.getElementById(id);
    const track = el.querySelector('.carousel-track');
    const dots = el.querySelectorAll('.carousel-dot');
    const state = carousels[id];
    if (state.locked) return;
    state.locked = true;
    state.current += dir;
    track.style.transition = 'transform 0.4s ease';
    track.style.transform = `translateX(-${state.current * 100}%)`;
    // 圓點對應（real index 1~total）
    const dotIndex = ((state.current - 1 + state.total) % state.total);
    dots.forEach((d, i) => d.classList.toggle('active', i === dotIndex));
  }

  function goToSlide(id, index) {
    const state = carousels[id];
    if (state.locked) return;
    const el = document.getElementById(id);
    const track = el.querySelector('.carousel-track');
    const dots = el.querySelectorAll('.carousel-dot');
    state.locked = true;
    state.current = index + 1;
    track.style.transition = 'transform 0.4s ease';
    track.style.transform = `translateX(-${state.current * 100}%)`;
    dots.forEach((d, i) => d.classList.toggle('active', i === index));
  }

  document.querySelectorAll('.carousel').forEach(el => initCarousel(el.id));
</script>
