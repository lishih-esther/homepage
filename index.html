<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>My Home</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f6fa;
            text-align: center;
            margin-top: 80px;
        }

        h1 {
            color: #2f3640;
        }

        h2 {
            text-align: left;
            flex-basis: 100%;
            margin: 10px;
        }

        .links {
            margin-top: 30px;
            display: flex;
            justify-content: flex-start;
            flex-wrap: wrap;
            max-width: 840px;
            margin-left: auto;
            margin-right: auto;
        }

        a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            margin: 10px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            color: #273c75;
            background: #ffffff;
            border: 2px solid #c5ceef;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(39, 60, 117, 0.08);
            transition: all 0.25s ease;
        }

        a:hover {
            color: #fff;
            background: linear-gradient(135deg, #4c6ef5, #273c75);
            border-color: transparent;
            box-shadow: 0 8px 20px rgba(39, 60, 117, 0.28);
            transform: translateY(-3px);
        }

        a:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(39, 60, 117, 0.15);
        }

        .pill-links a {
            width: auto;
            height: auto;
            padding: 10px 22px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #4c6ef5, #273c75);
            border: none;
            box-shadow: 0 4px 12px rgba(39, 60, 117, 0.22);
            letter-spacing: 0.3px;
        }

        .pill-links a:hover {
            background: linear-gradient(135deg, #3b5bdb, #1e3a8a);
            box-shadow: 0 8px 22px rgba(39, 60, 117, 0.38);
            transform: translateY(-3px);
            color: #fff;
        }

        .search-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 24px auto 0;
            width: min(92vw, 1140px);
        }

        .google-form {
            margin: 0;
            flex: 1;
            min-width: 260px;
            width: auto;
            display: flex;
            gap: 10px;
            padding: 12px;
            border-radius: 14px;
            background: linear-gradient(145deg, #ffffff, #eef2ff);
            box-shadow: 0 10px 24px rgba(39, 60, 117, 0.12);
            border: 1px solid #d7def8;
        }

        .google-input {
            flex: 1;
            height: 44px;
            border: 1px solid #c5ceef;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .google-input:focus {
            border-color: #4c6ef5;
            box-shadow: 0 0 0 3px rgba(76, 110, 245, 0.15);
        }

        .google-btn {
            height: 44px;
            border: 0;
            border-radius: 10px;
            padding: 0 18px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #2f6fed, #2457bc);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .google-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(36, 87, 188, 0.35);
        }

        .google-btn:active {
            transform: translateY(0);
        }

        .bing-form {
            margin: 0;
            flex: 1;
            min-width: 260px;
            width: auto;
            display: flex;
            gap: 10px;
            padding: 12px;
            border-radius: 14px;
            background: linear-gradient(145deg, #ffffff, #eef2ff);
            box-shadow: 0 10px 24px rgba(39, 60, 117, 0.12);
            border: 1px solid #d7def8;
        }

        .bing-input {
            flex: 1;
            height: 44px;
            border: 1px solid #c5ceef;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .bing-input:focus {
            border-color: #4c6ef5;
            box-shadow: 0 0 0 3px rgba(76, 110, 245, 0.15);
        }

        .bing-btn {
            height: 44px;
            border: 0;
            border-radius: 10px;
            padding: 0 18px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #2f6fed, #2457bc);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .bing-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(36, 87, 188, 0.35);
        }

        .bing-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .search-row {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                margin: 16px auto 0;
                width: min(94vw, 560px);
            }

            .google-form,
            .bing-form {
                flex-direction: column;
                width: 100%;
                box-sizing: border-box;
            }

            .google-input,
            .bing-input {
                flex: none;
                width: 100%;
                height: 44px;
                box-sizing: border-box;
            }

            .google-btn,
            .bing-btn {
                width: 100%;
                height: 44px;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>

    <h1>首頁</h1>
    <div class="search-row">
    <form class="google-form" action="https://www.google.com/search" method="get" target="_blank">
        <input class="google-input" type="text" name="q" placeholder="搜尋關鍵字">
        <button class="google-btn" type="submit">Google 搜尋</button>
    </form>
    <form class="bing-form" action="https://www.bing.com/search" method="get" target="_blank">
        <input class="bing-input" type="text" name="q" placeholder="搜尋關鍵字">
        <button class="bing-btn" type="submit">Bing 搜尋</button>
    </form>
    </div>
    <div class="links pill-links">
        <h2>資料儲存區</h2>
        <a href="https://onedrive.live.com/?view=0">One Drive</a>
        <a href="https://drive.google.com">Google Drive</a>
    </div>
    <div class="links pill-links">
        <h2>常用連結區</h2>
        <a href="markdown-basics.html">Markdown 寫作格式教學</a>
    </div>
    <div class="links pill-links">
        <a href="https://mail.google.com/mail/u/0/#inbox">Gmail</a>
        <a href="https://calendar.google.com">Google Calendar</a>
        <a href="https://gemini.google.com/app?utm_source=app_launcher&utm_medium=owned&utm_campaign=base_all">Google
            Gemini</a>
    </div>
    <div class="links pill-links">
        <a href="https://notion.so">Notion</a>
        <a href="https://chatgpt.com/">ChatGPT</a>
        <a href="https://github.com/">GitHub</a>
        <a href="https://gitlab.com/">GitLab</a>
    </div>
    <div class="links pill-links">
        <a href="https://outlook.live.com/mail/">Outlook</a>
        <a href="https://copilot.microsoft.com/">Copilot</a>
    </div>

</body>

</html>
