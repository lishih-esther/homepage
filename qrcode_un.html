<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code 工具｜解析 + 產生</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei", "Segoe UI", system-ui, sans-serif;
    margin: 0; padding: 24px;
    background: #f4f6f9; color: #1f2933;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 640px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 14px; margin: 0 0 18px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .tab {
    flex: 1; padding: 10px; text-align: center; cursor: pointer;
    background: #e8edf3; border: none; border-radius: 8px;
    font-size: 15px; font-weight: 600; color: #4b5563; transition: .15s;
  }
  .tab.active { background: #2563eb; color: #fff; }
  .panel { display: none; }
  .panel.active { display: block; }
  #drop {
    border: 2px dashed #b6c2d2; border-radius: 12px;
    background: #fff; padding: 40px 20px; text-align: center;
    cursor: pointer; transition: .15s;
  }
  #drop.hover { border-color: #2563eb; background: #eff5ff; }
  #drop p { margin: 6px 0; color: #4b5563; }
  #drop .big { font-size: 15px; color: #1f2933; font-weight: 600; }
  #file { display: none; }
  .btn {
    display: inline-block; margin-top: 10px; padding: 8px 18px;
    background: #2563eb; color: #fff; border-radius: 8px;
    font-size: 14px; border: none; cursor: pointer;
  }
  .btn:hover { background: #1d4ed8; }
  .card { background: #fff; border-radius: 12px; padding: 18px; margin-top: 18px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card h2 { font-size: 14px; margin: 0 0 10px; color: #6b7280; font-weight: 600; }
  #preview { max-width: 100%; max-height: 260px; border-radius: 8px; display: block; }
  #result {
    white-space: pre-wrap; word-break: break-all; font-size: 15px;
    background: #f8fafc; border: 1px solid #e5e9f0; border-radius: 8px;
    padding: 12px; min-height: 24px;
  }
  #result a { color: #2563eb; }
  .ok { color: #16a34a; font-weight: 600; }
  .err { color: #dc2626; font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .copy { padding: 6px 14px; font-size: 13px; background: #e5e9f0; color: #1f2933;
    border: none; border-radius: 6px; cursor: pointer; }
  .copy:hover { background: #d4dae6; }
  .hidden { display: none; }
  /* 產生分頁 */
  label { font-size: 13px; color: #4b5563; display: block; margin-bottom: 4px; }
  textarea {
    width: 100%; min-height: 90px; resize: vertical; padding: 10px;
    border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px;
    font-family: inherit;
  }
  .opts { display: flex; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
  .opt { flex: 1; min-width: 130px; }
  select, input[type=number], input[type=color] {
    width: 100%; padding: 8px; border: 1px solid #cbd5e1;
    border-radius: 8px; font-size: 14px; font-family: inherit;
  }
  input[type=color] { height: 38px; padding: 4px; cursor: pointer; }
  #qrOut { display: flex; justify-content: center; }
  #qrOut canvas { border-radius: 8px; }
  #genHint { color: #6b7280; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>QR Code 工具</h1>
  <p class="sub">解析圖片或產生 QR Code，全部在本機瀏覽器完成，資料不會上傳到任何伺服器。</p>

  <div class="tabs">
    <button class="tab active" data-tab="decode">解析圖片</button>
    <button class="tab" data-tab="encode">產生 QR Code</button>
  </div>

  <!-- ========== 解析分頁 ========== -->
  <div class="panel active" id="panel-decode">
    <div id="drop">
      <p class="big">點擊選擇圖片</p>
      <p>或將圖片拖曳到此處 / 直接 Ctrl+V 貼上</p>
      <button class="btn" type="button" id="pick">選擇檔案</button>
      <input type="file" id="file" accept="image/*">
    </div>

    <div class="card hidden" id="previewCard">
      <h2>圖片預覽</h2>
      <img id="preview" alt="preview">
    </div>

    <div class="card hidden" id="resultCard">
      <h2 id="status">解析結果</h2>
      <div id="result"></div>
      <div class="row">
        <button class="copy hidden" id="copy">複製內容</button>
      </div>
    </div>
  </div>

  <!-- ========== 產生分頁 ========== -->
  <div class="panel" id="panel-encode">
    <div class="card" style="margin-top:0">
      <h2>輸入內容</h2>
      <label for="genText">文字 / 網址 / 任意內容</label>
      <textarea id="genText" placeholder="例如：https://example.com 或任意文字"></textarea>

      <div class="opts">
        <div class="opt">
          <label for="ecLevel">糾錯等級</label>
          <select id="ecLevel">
            <option value="L">L（低 7%）</option>
            <option value="M" selected>M（中 15%）</option>
            <option value="Q">Q（較高 25%）</option>
            <option value="H">H（高 30%）</option>
          </select>
        </div>
        <div class="opt">
          <label for="size">尺寸（px）</label>
          <input type="number" id="size" value="280" min="80" max="1000" step="20">
        </div>
        <div class="opt">
          <label for="fgColor">前景色</label>
          <input type="color" id="fgColor" value="#000000">
        </div>
        <div class="opt">
          <label for="bgColor">背景色</label>
          <input type="color" id="bgColor" value="#ffffff">
        </div>
      </div>

      <div class="row">
        <button class="btn" type="button" id="genBtn" style="margin-top:14px">產生 QR Code</button>
        <span id="genHint" style="margin-top:14px"></span>
      </div>
    </div>

    <div class="card hidden" id="qrCard">
      <h2>產生結果</h2>
      <div id="qrOut"></div>
      <div class="row">
        <button class="btn" type="button" id="dlPng">下載 PNG</button>
      </div>
    </div>
  </div>
</div>

<canvas id="canvas" class="hidden"></canvas>

<script>
/* ===== 分頁切換 ===== */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

/* ===== 解析功能 ===== */
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const pickBtn = document.getElementById('pick');
const preview = document.getElementById('preview');
const previewCard = document.getElementById('previewCard');
const resultCard = document.getElementById('resultCard');
const resultEl = document.getElementById('result');
const statusEl = document.getElementById('status');
const copyBtn = document.getElementById('copy');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

let lastText = '';

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function linkify(text) {
  const esc = escapeHtml(text);
  if (/^https?:\/\/\S+$/i.test(text.trim())) {
    return `<a href="${esc}" target="_blank" rel="noopener noreferrer">${esc}</a>`;
  }
  return esc;
}
function showResult(text) {
  lastText = text;
  statusEl.innerHTML = '<span class="ok">✓ 解析成功</span>';
  resultEl.innerHTML = linkify(text);
  copyBtn.classList.remove('hidden');
  resultCard.classList.remove('hidden');
}
function showError(msg) {
  lastText = '';
  statusEl.innerHTML = '<span class="err">✗ 解析失敗</span>';
  resultEl.textContent = msg;
  copyBtn.classList.add('hidden');
  resultCard.classList.remove('hidden');
}
function decodeImage(img) {
  const MAX = 1600;
  let { naturalWidth: w, naturalHeight: h } = img;
  const scale = Math.min(1, MAX / Math.max(w, h));
  w = Math.round(w * scale); h = Math.round(h * scale);
  canvas.width = w; canvas.height = h;
  ctx.drawImage(img, 0, 0, w, h);
  const imageData = ctx.getImageData(0, 0, w, h);
  const code = jsQR(imageData.data, w, h, { inversionAttempts: 'attemptBoth' });
  if (code && code.data) showResult(code.data);
  else showError('在這張圖片中找不到可辨識的 QR Code。請確認 QR Code 清晰、完整且未被裁切。');
}
function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    showError('請提供圖片檔案（PNG / JPG / GIF / WebP 等）。');
    return;
  }
  const url = URL.createObjectURL(file);
  preview.src = url;
  previewCard.classList.remove('hidden');
  const img = new Image();
  img.onload = () => { decodeImage(img); URL.revokeObjectURL(url); };
  img.onerror = () => { showError('無法讀取此圖片檔。'); URL.revokeObjectURL(url); };
  img.src = url;
}
pickBtn.addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });
drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
['dragenter','dragover'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hover'); }));
['dragleave','drop'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) handleFile(f); });
window.addEventListener('paste', e => {
  for (const it of e.clipboardData.items) {
    if (it.type.startsWith('image/')) { handleFile(it.getAsFile()); break; }
  }
});
copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(lastText);
    copyBtn.textContent = '已複製 ✓';
    setTimeout(() => copyBtn.textContent = '複製內容', 1500);
  } catch { copyBtn.textContent = '複製失敗'; }
});

/* ===== 產生功能 ===== */
const genText = document.getElementById('genText');
const ecLevel = document.getElementById('ecLevel');
const sizeInput = document.getElementById('size');
const fgColor = document.getElementById('fgColor');
const bgColor = document.getElementById('bgColor');
const genBtn = document.getElementById('genBtn');
const genHint = document.getElementById('genHint');
const qrCard = document.getElementById('qrCard');
const qrOut = document.getElementById('qrOut');
const dlPng = document.getElementById('dlPng');

function generateQR() {
  const text = genText.value;
  if (!text.trim()) {
    genHint.innerHTML = '<span class="err">請先輸入內容</span>';
    qrCard.classList.add('hidden');
    return;
  }
  genHint.textContent = '';
  const size = Math.max(80, Math.min(1000, parseInt(sizeInput.value) || 280));
  qrOut.innerHTML = '';
  const out = document.createElement('canvas');
  QRCode.toCanvas(out, text, {
    width: size,
    margin: 2,
    errorCorrectionLevel: ecLevel.value,
    color: { dark: fgColor.value, light: bgColor.value }
  }, err => {
    if (err) {
      genHint.innerHTML = '<span class="err">產生失敗：' + escapeHtml(String(err.message || err)) + '</span>';
      qrCard.classList.add('hidden');
      return;
    }
    qrOut.appendChild(out);
    qrCard.classList.remove('hidden');
  });
}

genBtn.addEventListener('click', generateQR);
// Enter（非換行）即時產生
genText.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); generateQR(); }
});

dlPng.addEventListener('click', () => {
  const c = qrOut.querySelector('canvas');
  if (!c) return;
  const a = document.createElement('a');
  a.download = 'qrcode.png';
  a.href = c.toDataURL('image/png');
  a.click();
});
</script>
</body>
</html>
