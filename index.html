<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>My Home</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f6fa;
            text-align: center;
            margin-top: 80px;
        }

        h1 {
            color: #2f3640;
        }

        h2 {
            text-align: left;
            flex-basis: 100%;
            margin: 10px;
        }

        .links {
            margin-top: 30px;
            display: flex;
            justify-content: flex-start;
            flex-wrap: wrap;
            max-width: 840px;
            margin-left: auto;
            margin-right: auto;
        }

        a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            margin: 10px;
            font-size: 16px;
            text-decoration: none;
            color: #273c75;
            border: 2px solid #273c75;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        a:hover {
            color: #fff;
            background-color: #273c75;
            border-color: #273c75;
        }
    </style>
</head>

<body>

    <h1>我的首頁</h1>

    <div class="links">
        <h2>資料儲存區</h2>
        <a href="https://mail.google.com">Gmail</a>
        <a href="https://drive.google.com">Google Drive</a>
    </div>
    <div class="links">
        <h2>常用連結區</h2>
        <a href="https://mail.google.com">Gmail</a>
        <a href="https://drive.google.com">Google Drive</a>
        <a href="https://calendar.google.com">Google Calendar</a>
        <a href="https://notion.so">Notion</a>
        <a href="https://mail.google.com">Gmail</a>
        <a href="https://drive.google.com">Google Drive</a>
        <a href="https://calendar.google.com">Google Calendar</a>
        <a href="https://notion.so">Notion</a>
    </div>

</body>

</html>
